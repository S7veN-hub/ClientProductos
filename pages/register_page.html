<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/style2.css">
    <link rel="stylesheet" href="../styles/style3.css">
    <script src="../frontend/scripts.js" type="module"></script>
    <title>PlantYshop</title>
</head>
<body data-page="register">
    <nav class="nav_menu_container">
        <div class="nav_web_title">PlantYshop</div>
        <ul class="nav_list_menu">
            <li><a class="menu_link" href="../index.html">Home</a></li>
            <li><a class="menu_link" href="">Contact</a></li>
            <li>
                <input type="text" name="" id="nav_search" placeholder="Search...">
            </li>
            <li class="menu_login_container">
                <a class="menu_login" href="./card_menu_login.html"><i class="fa-solid fa-user"></i></a>
            </li>
        </ul>
    </nav>
    <div class="card_login_container">
        <div class="card_login_container_image">
            <img src="../img/login_image.webp" alt="Login Image">
        </div>
        <div class="card_login_container_info">
            <h2>Sign Up</h2>
            <form action="" class="form_login_container" id="form_register" name="form_register">
                <input type="text" name="Username" id="Username" placeholder="Username" required>
                <input type="email" name="Email" id="Email" placeholder="Email" required>
                <input type="password" name="Password" id="Password" placeholder="Password" maxlength="15" required>
                <input type="password" name="ConfirmPassword" id="ConfirmPassword" placeholder="Confirm Password" maxlength="15" required>
                <button type="submit" class="register_button_disabled">Register</button>
                <p class="error_message" id="error_message1">The password is not the same.</p>
                <p class="error_message" id="error_message2">The username or email already exists.</p>
                <p class="error_message" id="error_message4">Registration failed.</p>
                <p class="success_message" id="success_message1">Registration successful.</p>
            </form>
        </div>
    </div>
    <footer class="footer_container">
        <div class="footer_container_info">
            My website from S7veN
        </div>
    </footer>
</body>
</html>
